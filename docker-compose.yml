services:
  postgres:
    image: postgres:16-alpine
    container_name: prometey-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: prometey
      POSTGRES_PASSWORD: prometey_dev_password
      POSTGRES_DB: prometey

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - prometey_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prometey -d prometey"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  prometey_postgres_data:
